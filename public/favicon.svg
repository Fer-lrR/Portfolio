<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Rich Gold & Amber Metallic Gradient -->
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#c25e00"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242831"/>
      <stop offset="50%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>

    <!-- Gold Crest Gradient -->
    <linearGradient id="crest-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Dark Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#121418" stroke="url(#gold-border)" stroke-width="3.5"/>

  <!-- Heraldic Shield Silhouette -->
  <path d="M 64,18 
           C 86,18 100,24 100,38 
           C 100,74 80,98 64,110 
           C 48,98 28,74 28,38 
           C 28,24 42,18 64,18 Z" 
        fill="url(#shield-fill)" 
        stroke="url(#gold-border)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#soft-glow)"
  />

  <!-- Inner Inset Shield Rim -->
  <path d="M 64,24 
           C 82,24 94,29 94,40 
           C 94,71 76,92 64,103 
           C 52,92 34,71 34,40 
           C 34,29 46,24 64,24 Z" 
        fill="none" 
        stroke="rgba(253, 230, 138, 0.25)" 
        stroke-width="1.5"
  />

  <!-- Iconic Monogram "LR" & Tech Crown Emblem -->
  <!-- Stylized 'R' with Architectural Pillar & Heritage Wing -->
  <g fill="url(#crest-gold)">
    <!-- Vertical Pillar / Backbone -->
    <rect x="46" y="38" width="8.5" height="48" rx="2.5"/>
    
    <!-- Top Capital -->
    <rect x="43" y="36" width="14.5" height="4" rx="1.5"/>
    
    <!-- Bottom Base -->
    <rect x="43" y="83" width="14.5" height="4" rx="1.5"/>

    <!-- 'R' Upper Loop with Bold Geometry -->
    <path d="M 52,38 
             H 69 
             C 78,38 83,43 83,50 
             C 83,57 78,62 69,62 
             H 52 Z 
             M 60.5,45.5 
             V 54.5 
             H 68 
             C 72,54.5 74.5,52.5 74.5,50 
             C 74.5,47.5 72,45.5 68,45.5 Z"
    />

    <!-- 'R' Dynamic Power Leg -->
    <path d="M 66,59 
             L 81,84 
             C 82,85.5 80.5,87 78,87 
             H 69 
             L 57,66 
             H 67 Z"
    />

    <!-- Diamond Star Accent -->
    <path d="M 64,26 L 66.5,31 L 71.5,33.5 L 66.5,36 L 64,41 L 61.5,36 L 56.5,33.5 L 61.5,31 Z" 
          fill="#fde68a" 
          opacity="0.9"
    />
  </g>
</svg>
